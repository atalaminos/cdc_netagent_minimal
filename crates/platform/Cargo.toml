[package]
name = "netagent-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
netagent-proto = { workspace = true }
netagent-core  = { workspace = true }

async-trait = { workspace = true }
tokio       = { workspace = true }
sysinfo     = { workspace = true }
tracing     = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix  = { version = "0.29", features = ["hostname", "reboot"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# WMI is reached through PowerShell (Get-CimInstance) + JSON, avoiding a heavy
# COM/FFI surface; the registry is read directly.
winreg = "0.52"
