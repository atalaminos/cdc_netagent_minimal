[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/platform",
    "crates/agent",
    "crates/mock-netedge",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["CDC <cdc@glucube.com>"]
license = "ISC"
rust-version = "1.75"

[workspace.dependencies]
# async runtime
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7" }
async-trait = "0.1"
futures     = "0.3"
futures-util = "0.3"

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1.3"
toml       = "0.8"

# crypto (mirror of netdd / netedge license scheme)
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
sha2          = "0.10"
rand          = "0.8"
base64        = "0.22"
hex           = "0.4"

# TLS (rustls everywhere, no OpenSSL)
rustls            = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls      = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile    = "2"
rustls-pki-types  = "1"
webpki-roots      = "0.26"

# HTTP / WS
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
axum              = { version = "0.7", features = ["ws"] }

# system info
sysinfo = "0.32"

# cli / config
clap    = { version = "4", features = ["derive", "env"] }

# logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# errors / misc
thiserror   = "1"
anyhow      = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
hostname    = "0.4"
parking_lot = "0.12"

# remote shell PTY + self-update
portable-pty = "0.8"
self-replace = "1"
tempfile     = "3"

# internal
netagent-proto = { path = "crates/proto" }
netagent-core  = { path = "crates/core" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
